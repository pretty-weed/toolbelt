version: "3"
vars:
  # ToDo, dump these values into actual maps
  ENV_FILE: '{{ .ENV_FILE | default ".env" }}'
  LOCAL_ENV_FILE: '{{ .LOCAL_ENV_FILE | default ".env.local"}}'
  SOURCE_ENV_FILE:
    sh: 'test -f "{{ .ROOT_DIR }}/{{ .ENV_FILE }}" && echo "source {{ .ROOT_DIR }}/{{ .ENV_FILE }};" || true'
  SOURCE_LOCAL_ENV_FILE:
    sh: 'test -f "{{ .ROOT_DIR }}/{{ .LOCAL_ENV_FILE }}" && echo "source {{ .ROOT_DIR }}/{{ .LOCAL_ENV_FILE }};" || true'
